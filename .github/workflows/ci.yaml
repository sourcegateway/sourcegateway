name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install pinned development tools
        run: make setup-tools
      - name: Verify generated artifacts
        run: |
          make generate
          git diff --exit-code
      - name: Validate, test, and build
        run: make precommit test lint build helm
      - name: Offline end-to-end test
        env:
          GOPROXY: "off"
        run: make e2e
