{{/* Source Gateway <https://sourcegateway.dev> | Copyright The Source Gateway Authors | SPDX-License-Identifier: Apache-2.0 */}}
{{- if .Values.enabled }}
{{- $encryptionSPC := default "" .Values.encryptionKey.secretProviderClass -}}
{{- $encryptionSecret := default "" .Values.encryptionKey.secretName -}}
{{- if and $encryptionSPC $encryptionSecret -}}{{ fail "encryptionKey must set only one of secretProviderClass or secretName" }}{{- end -}}
{{- if not (or $encryptionSPC $encryptionSecret) -}}{{ fail "encryptionKey must set secretProviderClass or secretName" }}{{- end -}}
{{- $tlsSPC := default "" .Values.servingTLS.secretProviderClass -}}
{{- $tlsSecret := default "" .Values.servingTLS.secretName -}}
{{- $tlsProjected := default dict .Values.servingTLS.projected -}}
{{- if ne (len (compact (list $tlsSPC $tlsSecret $tlsProjected))) 1 -}}{{ fail "servingTLS must set exactly one of secretProviderClass, secretName or projected" }}{{- end -}}
{{- if and $tlsProjected (empty $tlsProjected.sources) -}}{{ fail "servingTLS.projected.sources must not be empty" }}{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sourcegateway.fullname" . }}
  labels:
    {{- include "sourcegateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sourcegateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sourcegateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{- end }}
      annotations:
        checksum/config: {{ include "sourcegateway.runtimeConfig" . | sha256sum }}
        checksum/secret-mounts: {{ dict "encryptionKey" .Values.encryptionKey "servingTLS" .Values.servingTLS "credentials" .Values.config.credentials | toJson | sha256sum }}
        {{- with .Values.podAnnotations }}{{ toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ include "sourcegateway.serviceAccountName" . }}
      automountServiceAccountToken: true
      hostUsers: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sourcegateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ default .Chart.AppVersion .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config=/etc/sourcegateway/config.jsonc"
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - { name: https, containerPort: 8443, protocol: TCP }
            - { name: metrics, containerPort: 9443, protocol: TCP }
          startupProbe:
            httpGet: { path: /healthz, port: metrics, scheme: HTTPS }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /healthz, port: metrics, scheme: HTTPS }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics, scheme: HTTPS }
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/sourcegateway, readOnly: true }
            - { name: storage, mountPath: {{ .Values.config.storageDirectory | quote }} }
            - { name: encryption-key, mountPath: {{ .Values.config.credentialsDirectory | quote }}, readOnly: true }
            - { name: serving-tls, mountPath: /var/run/sourcegateway/tls, readOnly: true }
            {{- range $group, $credentials := .Values.config.credentials }}
            {{- range $name, $credential := $credentials }}
            {{- if not (has $credential.kind (list "awsDefault" "gcsDefault")) }}
            - name: {{ printf "credential-%s-%s" $group $name | sha256sum | trunc 20 }}
              mountPath: {{ printf "%s/%s" $.Values.config.credentialsDirectory $name | quote }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
      volumes:
        - name: config
          configMap: { name: {{ include "sourcegateway.fullname" . }} }
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ include "sourcegateway.fullname" . }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: encryption-key
          {{- if $encryptionSPC }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: {{ $encryptionSPC | quote }} }
          {{- else }}
          secret:
            secretName: {{ $encryptionSecret | quote }}
            defaultMode: 0400
          {{- end }}
        - name: serving-tls
          {{- if $tlsSPC }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: {{ $tlsSPC | quote }} }
          {{- else if $tlsProjected }}
          {{- $projection := deepCopy $tlsProjected }}
          {{- if not (hasKey $projection "defaultMode") }}{{- $_ := set $projection "defaultMode" 256 }}{{- end }}
          projected:
            {{- toYaml $projection | nindent 12 }}
          {{- else }}
          secret:
            secretName: {{ $tlsSecret | quote }}
            defaultMode: 0400
          {{- end }}
        {{- range $group, $credentials := .Values.config.credentials }}
        {{- range $name, $credential := $credentials }}
        {{- if not (has $credential.kind (list "awsDefault" "gcsDefault")) }}
        {{- $credentialSPC := default "" $credential.secretProviderClass }}
        {{- $credentialSecret := default "" $credential.secretName }}
        {{- if and $credentialSPC $credentialSecret }}{{ fail (printf "config.credentials.%s.%s must set only one of secretProviderClass or secretName" $group $name) }}{{ end }}
        {{- if not (or $credentialSPC $credentialSecret) }}{{ fail (printf "config.credentials.%s.%s must set secretProviderClass or secretName for %s" $group $name $credential.kind) }}{{ end }}
        - name: {{ printf "credential-%s-%s" $group $name | sha256sum | trunc 20 }}
          {{- if $credentialSPC }}
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ $credentialSPC | quote }}
          {{- else }}
          secret:
            secretName: {{ $credentialSecret | quote }}
            defaultMode: 0400
          {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
{{- end }}
