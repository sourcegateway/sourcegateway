{{- if .Values.enabled }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sourcegateway.fullname" . }}-ingress
  labels:
    {{- include "sourcegateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sourcegateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      ports:
        - { port: https, protocol: TCP }
    {{- with .Values.networkPolicy.metricsIngressFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - { port: metrics, protocol: TCP }
    {{- end }}
{{- end }}
{{- end }}
