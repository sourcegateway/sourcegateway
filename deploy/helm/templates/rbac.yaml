{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sourcegateway.fullname" . }}
  labels:
    {{- include "sourcegateway.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/readyz]
    verbs: [get]
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [sourcegateway.dev]
    resources: [gitrepositories, objectstoragebuckets]
    verbs: [list, watch]
  - apiGroups: [sourcegateway.dev]
    resources: [gitrepositories/status, objectstoragebuckets/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sourcegateway.fullname" . }}
  labels:
    {{- include "sourcegateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sourcegateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sourcegateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
