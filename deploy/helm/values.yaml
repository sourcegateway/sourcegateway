# Enable only when this Helm release should own the CRDs.
crds:
  enabled: false

# Disable to install or upgrade only the CRDs.
enabled: true

image:
  repository: ghcr.io/sourcegateway/sourcegateway
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
extraArgs: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 443
  annotations: {}

config:
  tokenAudience: sourcegateway.dev
  objectCacheCapacity: 20Gi
  maxObjectSize: 15Mi
  credentialsDirectory: /var/run/sourcegateway/secrets
  githubUserAnnotation: sourcegateway.dev/github-user
  listenAddress: ":8443"
  metricsAddress: ":9443"
  storageDirectory: /var/lib/sourcegateway
  credentials:
    gitRepository: {}
    objectStorageBucket: {}

# The selected source must expose a file named encryption-key at its volume root.
encryptionKey:
  secretProviderClass: ""
  secretName: ""

# The selected source must expose tls.crt and tls.key at its volume root.
servingTLS:
  secretProviderClass: ""
  secretName: ""
  # Alternative ProjectedVolumeSource with nonempty sources; defaults to mode 0400.
  projected: null
  certificateFile: tls.crt
  privateKeyFile: tls.key

persistence:
  enabled: true
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 30Gi
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
# false runs UID 0 in a private Pod user namespace (requires idmapped-mount
# support). true runs without one, for runtimes that cannot join a Pod user
# namespace such as gVisor; it requires a non-root runAsUser and an fsGroup so
# mounted credentials remain readable, for example:
#   hostUsers: true
#   podSecurityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
hostUsers: false
podSecurityContext:
  # UID 0 is mapped to a unique unprivileged host UID by spec.hostUsers=false.
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true
  # Empty permits application ingress from all namespaces.
  ingressFrom: []
  # Empty keeps the operational port private except for node-originated probes.
  metricsIngressFrom: []

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}
priorityClassName: ""
