# Example values covering every supported credential mount form.
image:
  tag: v0.1.0
encryptionKey:
  secretProviderClass: sourcegateway-encryption-key
servingTLS:
  secretProviderClass: sourcegateway-serving-tls
config:
  credentials:
    gitRepository:
      example-github:
        kind: githubApp
        namespaces: [agents]
        secretProviderClass: example-github
    objectStorageBucket:
      example-aws:
        kind: awsAccessKey
        namespaces: [agents, builds]
        secretName: example-aws
      example-gcs:
        kind: gcsDefault
        namespaces: [agents]
