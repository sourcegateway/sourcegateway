---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sourcegateway-role
rules:
- nonResourceURLs:
  - /readyz
  verbs:
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - sourcegateway.dev
  resources:
  - gitrepositories
  - objectstoragebuckets
  verbs:
  - list
  - watch
- apiGroups:
  - sourcegateway.dev
  resources:
  - gitrepositories/status
  - objectstoragebuckets/status
  verbs:
  - update
